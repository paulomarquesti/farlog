<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarLog - Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- CDN Oficial do Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>FarLog 🏍️💨</h2>
            <p>Gerenciador de Logística Farmacêutica</p>
        </div>
        
        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" placeholder="balcao@farmacia.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" id="btn-login">Entrar no Painel</button>
        </form>
        
        <div id="error-message" class="error-message hidden"></div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
