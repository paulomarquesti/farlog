<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarLog - Painel de Controle</title>
    <link rel="stylesheet" href="painel.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
</head>
<body>
    <header class="main-header">
        <h1>FarLog 🏍️💨</h1>
        <div class="user-info">
            <span id="user-email">Carregando usuário...</span>
            <button id="btn-logout">Sair</button>
        </div>
    </header>

    <main class="dashboard-container">
        <section class="card">
            <h3>👥 Cadastrar Entregador</h3>
            <form id="form-entregador">
                <div class="input-group">
                    <label for="nome-entregador">Nome do Profissional</label>
                    <input type="text" id="nome-entregador" placeholder="Ex: João Silva" required>
                </div>
                <div class="input-group">
                    <label for="whatsapp-entregador">WhatsApp (Com DDD)</label>
                    <input type="tel" id="whatsapp-entregador" placeholder="Ex: 21999999999" required>
                </div>
                <div class="input-group">
                    <label for="veiculo-entregador">Veículo Padrão</label>
                    <select id="veiculo-entregador" required>
                        <option value="Moto">Moto</option>
                        <option value="Bicicleta">Bicicleta</option>
                    </select>
                </div>
                <div class="input-group" id="group-autonomia">
                    <label for="autonomia-moto">Autonomia da Moto (km/L)</label>
                    <input type="number" id="autonomia-moto" value="30" step="0.1">
                </div>
                <button type="submit" class="btn-success">Salvar Entregador</button>
            </form>

            <hr>

            <h3>Lista de Entregadores</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Veículo</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-entregadores">
                    </tbody>
            </table>
        </section>

        <section class="card">
            <h3>📦 Nova Saída de Pedido</h3>
            <form id="form-entrega">
                <div class="input-group">
                    <label for="endereco-entrega">Endereço de Destino</label>
                    <input type="text" id="endereco-entrega" placeholder="Rua, Número, Bairro" required>
                </div>
                
                <div class="input-group">
                    <label for="seletor-entregador">Selecionar Entregador Disponível</label>
                    <select id="seletor-entregador" required>
                        <option value="">Selecione...</option>
                        </select>
                </div>

                <div class="row">
                    <div class="input-group flex-1">
                        <label for="veiculo-entrega">Veículo para esta Rota</label>
                        <select id="veiculo-entrega" required>
                            <option value="Moto">Moto</option>
                            <option value="Bicicleta">Bicicleta</option>
                        </select>
                    </div>
                    <div class="input-group flex-1">
                        <label for="pagamento-entrega">Forma de Pagamento / Troco</label>
                        <input type="text" id="pagamento-entrega" placeholder="Ex: Cartão ou Dinheiro troco p/ 50" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Despachar e Gerar Link WhatsApp</button>
            </form>

            <hr>

            <h3>Monitor de Entregas Ativas (Na Rua)</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Destino</th>
                        <th>Entregador</th>
                        <th>Pagamento</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-entregas-ativas">
                    </tbody>
            </table>
        </section>
    </main>

    <script src="painel.js"></script>
</body>
</html>
